name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          UNIVERSAL=1 VERSION="$VERSION" ./scripts/build-app.sh
          ditto -c -k --keepParent dist/Phosphor.app dist/Phosphor.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Phosphor
          path: dist/Phosphor.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Phosphor.zip
