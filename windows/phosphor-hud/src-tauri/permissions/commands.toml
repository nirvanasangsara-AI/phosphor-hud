[[permission]]
identifier = "allow-app-version"
description = "Read the VERSION file baked into this build."
commands.allow = ["app_version"]

[[permission]]
identifier = "allow-hud-state"
description = "Read the current HUD snapshot."
commands.allow = ["hud_state"]

[[permission]]
identifier = "allow-hide-hud"
description = "Hide the HUD window."
commands.allow = ["hide_hud"]

[[permission]]
identifier = "allow-show-hud"
description = "Show the HUD window."
commands.allow = ["show_hud"]

[[permission]]
identifier = "allow-set-demo"
description = "Toggle demo numbers."
commands.allow = ["set_demo"]

[[permission]]
identifier = "allow-set-show-dev"
description = "Toggle GitHub PR counts."
commands.allow = ["set_show_dev"]

[[permission]]
identifier = "allow-phone-sync-state"
description = "Read the phone pairing card."
commands.allow = ["phone_sync_state"]

[[permission]]
identifier = "allow-set-phone-sync"
description = "Turn phone sync on or off."
commands.allow = ["set_phone_sync"]

[[permission]]
identifier = "allow-rotate-phone-code"
description = "Issue a new pairing code."
commands.allow = ["rotate_phone_code"]

[[permission]]
identifier = "allow-collapse-prefs"
description = "Read the HUD collapse mode."
commands.allow = ["collapse_prefs"]

[[permission]]
identifier = "allow-set-collapse-mode"
description = "Remember the HUD collapse mode."
commands.allow = ["set_collapse_mode"]

[[permission]]
identifier = "allow-set-hud-collapsed"
description = "Fold or unfold the HUD window from its top-left corner."
commands.allow = ["set_hud_collapsed"]
