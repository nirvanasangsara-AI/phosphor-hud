<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phosphor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="panel">
    <header>
      <div class="brand" id="strip" data-tauri-drag-region>
        <span class="phi">Φ</span>
        <span class="name">Phosphor</span>
        <span id="peak" class="peak"></span>
        <span id="reset" class="peak"></span>
      </div>
      <div class="actions">
        <button id="pin" type="button" title="항상 펼칩니다. 다시 누르면 이전 접기 방식으로 돌아갑니다.">고정</button>
        <select id="collapse-mode" title="접기 방식" aria-label="접기 방식">
          <option value="pin">고정</option>
          <option value="doubleClick">더블클릭</option>
          <option value="auto">자동 접기</option>
        </select>
        <button id="refresh" class="extra" type="button" title="Refresh">Refresh</button>
        <button id="hide" class="extra" type="button" title="Hide">Hide</button>
      </div>
    </header>
    <div id="alerts" class="alerts" hidden></div>
    <main id="rows"></main>
    <div id="phone-card" class="phone" hidden></div>
    <footer id="foot"></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
